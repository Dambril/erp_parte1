apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    /* Folders */
    //   The root of your project, i.e. where "package.json" lives. Default is '..'
    // root = file("../")
    //   The folder where the react-native NPM package is. Default is ../node_modules/react-native
    reactNativeDir = file("../../../../node_modules/react-native")
    //   The folder where the react-native Codegen package is. Default is ../node_modules/@react-native/codegen
    codegenDir = file("../../../../node_modules/@react-native/codegen")
    //   The cli.js file which is the React Native CLI entrypoint. Default is ../node_modules/react-native/cli.js
    cliFile = file("../../../../node_modules/react-native/cli.js")

    /* Variants */
    //   The list of variants to that are debuggable. For those we're going to
    //   skip the bundling of the JS bundle and the assets. By default is just 'debug'.
    //   If you add flavors like lite, prod, etc. you'll have to list your debuggableVariants.
    // debuggableVariants = ["liteDebug", "prodDebug"]

    /* Bundling */
    //   A list containing the node command and its flags. Default is just 'node'.
    // nodeExecutableAndArgs = ["node"]
    //
    //   The command to run when bundling. By default is 'bundle'
    // bundleCommand = "ram-bundle"
    //
    //   The path to the CLI configuration file. Default is empty.
    // bundleConfig = file(../rn-cli.config.js)
    //
    //   The name of the generated asset file containing your JS bundle
    // bundleAssetName = "MyApplication.android.bundle"
    //
    //   The entry file for bundle generation. Default is 'index.android.js' or 'index.js'
    // entryFile = file("../js/MyApplication.android.js")
    //
    //   A list of extra flags to pass to the 'bundle' commands.
    //   See https://github.com/react-native-community/cli/blob/main/docs/commands.md#bundle
    //   La URL de la API se incrusta al transpilar (babel.config.js); sin esto Metro reutilizaría de su
    //   caché el bundle hecho con una URL anterior.
    extraPackagerArgs = ["--reset-cache"]

    /* Hermes Commands */
    //   The hermes compiler command to run. By default it is 'hermesc'
    // hermesCommand = "$rootDir/my-custom-hermesc/bin/hermesc"
    //   En este monorepo react-native está en el node_modules de la raíz, no junto a la app.
    hermesCommand = "$rootDir/../../../node_modules/react-native/sdks/hermesc/%OS-BIN%/hermesc"
    //
    //   The list of flags to pass to the Hermes compiler. By default is "-O", "-output-source-map"
    // hermesFlags = ["-O", "-output-source-map"]
}

/**
 * Set this to true to Run Proguard on Release builds to minify the Java bytecode.
 */
def enableProguardInReleaseBuilds = false

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 *
 * For example, to use the international variant, you can use:
 * `def jscFlavor = 'org.webkit:android-jsc-intl:+'`
 *
 * The international variant includes ICU i18n library and necessary data
 * allowing to use e.g. `Date.toLocaleString` and `String.localeCompare` that
 * give correct results when using with locales other than en-US. Note that
 * this variant is about 6MiB larger per architecture than default.
 */
def jscFlavor = 'org.webkit:android-jsc:+'

/**
 * URL de la API que usará la app. Se define al compilar, nunca en el código: variable de entorno
 * TSSERA_API_URL (la misma que lee babel.config.js) o `-PTSSERA_API_URL=...`.
 */
def tsseraApiUrl = (System.getenv('TSSERA_API_URL') ?: project.findProperty('TSSERA_API_URL') ?: '').toString().trim()
def tsseraApiUri = tsseraApiUrl ? new URI(tsseraApiUrl) : null
if (tsseraApiUrl && !(tsseraApiUri.scheme in ['http', 'https'] && tsseraApiUri.host)) {
    throw new GradleException("TSSERA_API_URL debe ser una URL http(s) completa, por ejemplo http://192.168.1.50:3000. Valor recibido: ${tsseraApiUrl}")
}

// Un APK release sin URL de API no serviría de nada: se detiene antes de compilar.
gradle.taskGraph.whenReady { graph ->
    if (!tsseraApiUrl && graph.allTasks.any { it.project == project && it.name ==~ /(assemble|bundle|install)Release/ }) {
        throw new GradleException('Falta TSSERA_API_URL. Ejemplo (PowerShell): $env:TSSERA_API_URL = "http://192.168.1.50:3000"; ./gradlew assembleRelease')
    }
}

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    // El namespace (paquete Java de MainActivity) puede diferir del applicationId, que es el id público en Play Store.
    namespace "com.erpmobile"
    defaultConfig {
        applicationId "com.tssera.construcciones"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0.0"
    }
    // Space Grotesk e Inter viven en packages/ui/assets/fonts (las mismas que usa la web): se empaquetan como assets/fonts.
    sourceSets {
        main {
            assets.srcDirs += ['../../../../packages/ui/assets']
        }
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        // Keystore propio: sus datos se leen de ~/.gradle/gradle.properties (nunca del repo).
        // Ver docs/despliegue.md, sección "App Android".
        if (project.hasProperty('TSSERA_UPLOAD_STORE_FILE')) {
            release {
                storeFile file(TSSERA_UPLOAD_STORE_FILE)
                storePassword TSSERA_UPLOAD_STORE_PASSWORD
                keyAlias TSSERA_UPLOAD_KEY_ALIAS
                keyPassword TSSERA_UPLOAD_KEY_PASSWORD
            }
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            // Sin keystore propio configurado se firma con el de debug: sirve para probar el APK, no para publicar.
            signingConfig project.hasProperty('TSSERA_UPLOAD_STORE_FILE') ? signingConfigs.release : signingConfigs.debug
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")
    implementation("com.facebook.react:flipper-integration")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}

apply from: file("../../../../node_modules/@react-native-community/cli-platform-android/native_modules.gradle"); applyNativeModulesAppBuildGradle(project)

/**
 * Configuración de seguridad de red, generada por variante en build/ (no se guarda en el repo).
 * - debug: permite HTTP sin cifrar (Metro y la API local).
 * - release: lo bloquea. Si TSSERA_API_URL es http://, se permite solo hacia ese host (la demo en la red local);
 *   con https:// (API desplegada o un túnel) no se abre ninguna excepción.
 */
android.applicationVariants.all { variant ->
    def outputDir = layout.buildDirectory.dir("generated/tssera/${variant.name}/res").get().asFile
    def cleartextHost = (tsseraApiUri?.scheme == 'http') ? tsseraApiUri.host : null
    def debuggable = variant.buildType.debuggable
    def generate = tasks.register("generate${variant.name.capitalize()}NetworkSecurityConfig") {
        inputs.property('cleartextHost', cleartextHost ?: '')
        inputs.property('debuggable', debuggable)
        outputs.dir(outputDir)
        doLast {
            def xml = new File(outputDir, 'xml/network_security_config.xml')
            xml.parentFile.mkdirs()
            def domain = (!debuggable && cleartextHost) ? """
    <domain-config cleartextTrafficPermitted="true">
        <domain includeSubdomains="false">${cleartextHost}</domain>
    </domain-config>""" : ''
            xml.text = """<?xml version="1.0" encoding="utf-8"?>
<network-security-config>
    <base-config cleartextTrafficPermitted="${debuggable}" />${domain}
</network-security-config>
"""
        }
    }
    variant.registerGeneratedResFolders(files(outputDir).builtBy(generate))
}

// La URL forma parte del bundle de JavaScript: si cambia, Gradle debe volver a generarlo aunque el código sea el mismo.
tasks.matching { it.name ==~ /createBundle.*JsAndAssets/ }.configureEach {
    inputs.property('tsseraApiUrl', tsseraApiUrl)
}
